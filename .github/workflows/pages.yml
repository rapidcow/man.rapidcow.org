name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
    paths-ignore:
      - "configure.*"
      - "README"
      - "README.md"
      - "view"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The build script, www-siteconf, comes from one repository in
  # parts: engine needs gengenlib (which needs codesets and
  # textdomain), and the web preset (configure) needs genlib and
  # template-provider.  Each is built from its own directory (the
  # list in the install step names it).  Listed in (rough)
  # topological order.
  #
  # The tags of gengenlib and siteconf must have 561e580 ("Accept
  # file names with colons for gmake and ninja"): our pages are
  # named man/3/RdKw::WwW::GenLib.html.
  #
  # (These are the tools that build the site, not the documentation
  # it publishes: that is in src/, taken by ./snapshot from the tags
  # that catalog names.)
  SITECONF_URL: https://github.com/rapidcow/siteconf.git
  CODESETS_REF: codesets/v0.00_00
  TEXTDOMAIN_REF: textdomain/v0.00_00
  GENGENLIB_REF: gengenlib/v0.01_00
  GENLIB_REF: genlib/v0.03_00
  TEMPLATE_PROVIDER_REF: template-provider/v0.00_00
  SITECONF_REF: siteconf/v0.03_00

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Perl is only needed to build; the site itself is static.
      # (mkman needs Pod::Simple, Pod::Man and JSON::PP, which are core.)
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus make gcc liburi-perl \
            libfile-sharedir-perl libfile-sharedir-install-perl \
            libencode-locale-perl

      # The distro's libtemplate-perl is older than the 3.103 we need,
      # so install Template Toolkit explicitly from CPAN.
      - name: Install Template Toolkit 3.103 from CPAN
        run: |
          sudo cpanm --notest Template::Toolkit~3.103

      - name: Install siteconf
        run: |
          prefix="$RUNNER_TEMP/siteconf"
          export PERL5LIB="$prefix/lib/perl5"
          set -- codesets "$CODESETS_REF" textdomain "$TEXTDOMAIN_REF" \
            gengenlib "$GENGENLIB_REF" genlib "$GENLIB_REF" \
            template-provider "$TEMPLATE_PROVIDER_REF" siteconf "$SITECONF_REF"
          while [ $# -gt 0 ]; do
            part=$1 ref=$2; shift 2
            git -c advice.detachedHead=false clone --quiet --depth 1 \
              --single-branch --branch "$ref" "$SITECONF_URL" "$RUNNER_TEMP/src/$part"
            (cd "$RUNNER_TEMP/src/$part/$part" &&
              perl Makefile.PL INSTALL_BASE="$prefix" &&
              make && make test && make install)
          done
          echo "PERL5LIB=$PERL5LIB" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      # The pages themselves, from the tags that catalog names (src/
      # has only their RELEASE files in Git).  Blobs are fetched as
      # snapshot asks for them.
      - name: Snapshot
        run: |
          git clone --quiet --filter=blob:none --no-checkout \
            "$SITECONF_URL" "$RUNNER_TEMP/snapshot"
          ./snapshot -r "$RUNNER_TEMP/snapshot"

      # GNU Make, for the `::' in the names of the pages (POSIX make
      # cannot have them).  Then the .ok markers that siteconf leaves
      # in every directory go, and every link must go somewhere.
      - name: Build
        run: |
          ./configure -Db=docs
          siteconf -gA -G gmake
          make docs
          find docs -name .ok -type f -delete
          ./checklinks docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
